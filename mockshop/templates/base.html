<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DemoMart{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="header">
        <a href="/" class="logo">DemoMart</a>
        <nav class="nav">
            <a href="/">Home</a>
            <form class="search-form" action="/search" method="get">
                <input type="text" name="q" placeholder="Search products..." data-testid="search-input">
                <button type="submit" data-testid="search-submit">Search</button>
            </form>
            <a href="/cart">Cart {% if cart_count %}<span class="cart-badge">{{ cart_count }}</span>{% endif %}</a>
            <a href="/orders">Orders</a>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
