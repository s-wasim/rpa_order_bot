<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Ergonomic foot rest">
  <rect width="400" height="300" fill="#eef2ff"/>
  <g stroke="#1e40af" stroke-width="8" stroke-linecap="round" fill="#dbeafe">
    <rect x="120" y="108" width="160" height="34" rx="8" transform="rotate(-8 200 125)"/>
    <line x1="150" y1="150" x2="150" y2="198"/>
    <line x1="250" y1="136" x2="250" y2="198"/>
  </g>
  <line x1="140" y1="96" x2="260" y2="80" stroke="#1e40af" stroke-width="6" stroke-linecap="round">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </line>
  <text x="200" y="232" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="600" fill="#1e40af">Foot Rest</text>
</svg>
